name: Build typst resume

on:
  push:
    branches:
      - main
    paths:
      - 'main.typ'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: typst-community/setup-typst@v5

      - name: Install Fonts
        run: |
          mkdir -p ~/.local/share/fonts/inter
          mkdir -p ~/.local/share/fonts/lato
          mkdir -p ~/.local/share/fonts/fontawesome
          
          # 1. Inter Font (Official google/fonts repository)
          curl -sSL "https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf" -o ~/.local/share/fonts/inter/Inter.ttf
          curl -sSL "https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter-Italic%5Bopsz,wght%5D.ttf" -o ~/.local/share/fonts/inter/Inter-Italic.ttf

          # 2. Lato Font (Official google/fonts repository)
          curl -sSL "https://raw.githubusercontent.com/google/fonts/main/ofl/lato/Lato-Regular.ttf" -o ~/.local/share/fonts/lato/Lato-Regular.ttf
          curl -sSL "https://raw.githubusercontent.com/google/fonts/main/ofl/lato/Lato-Bold.ttf" -o ~/.local/share/fonts/lato/Lato-Bold.ttf
          curl -sSL "https://raw.githubusercontent.com/google/fonts/main/ofl/lato/Lato-Italic.ttf" -o ~/.local/share/fonts/lato/Lato-Italic.ttf
          curl -sSL "https://raw.githubusercontent.com/google/fonts/main/ofl/lato/Lato-BoldItalic.ttf" -o ~/.local/share/fonts/lato/Lato-BoldItalic.ttf

          # 3. Font Awesome (Official FontAwesome GitHub releases)
          curl -sSL "https://github.com/FortAwesome/Font-Awesome/raw/6.x/webfonts/fa-solid-900.ttf" -o ~/.local/share/fonts/fontawesome/fa-solid-900.ttf
          curl -sSL "https://github.com/FortAwesome/Font-Awesome/raw/6.x/webfonts/fa-brands-400.ttf" -o ~/.local/share/fonts/fontawesome/fa-brands-400.ttf
          curl -sSL "https://github.com/FortAwesome/Font-Awesome/raw/6.x/webfonts/fa-regular-400.ttf" -o ~/.local/share/fonts/fontawesome/fa-regular-400.ttf

          # Refresh the system font cache
          fc-cache -f -v

      - run: typst compile main.typ resume.pdf

      - name: Generate tag
        id: tag
        run: |
          TAG="v$(date +'%Y.%m.%d').${{ github.run_number }}"
          echo "Generated tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            resume.pdf
